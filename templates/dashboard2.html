
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Status Lampu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            color: #222;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .status {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            padding: 18px;
            border-radius: 10px;
        }

        .on {
            background: #d1fae5;
            color: #047857;
        }

        .off {
            background: #fee2e2;
            color: #b91c1c;
        }

        .motion {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .no-motion {
            background: #f3f4f6;
            color: #6b7280;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .control {
            margin-top: 15px;
        }

        .mode {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .mode button,
        .lamp-control button {
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }

        .mode button {
            flex: 1;
            background: #e5e7eb;
            color: #374151;
        }

        .mode button.active {
            background: #2563eb;
            color: white;
        }

        .lamp-control {
            display: flex;
            gap: 10px;
        }

        .lamp-control button {
            flex: 1;
        }

        .btn-on {
            background: #16a34a;
            color: white;
        }

        .btn-off {
            background: #dc2626;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .mode-status {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            background: #f3f4f6;
            font-weight: bold;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .update {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .container {
                margin: 10px auto;
                padding: 12px;
            }

            .lamp-control {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Dashboard Status Lampu</h1>

    <!-- ========================= -->
    <!-- STATUS SENSOR PIR -->
    <!-- ========================= -->

    <div class="card">

        <h2>Sensor PIR</h2>

        <div id="gerakan" class="status no-motion">
            Tidak Ada Gerakan
        </div>

    </div>


    <!-- ========================= -->
    <!-- STATUS LAMPU -->
    <!-- ========================= -->

    <div class="grid">

        <div class="card">

            <h2>Lampu 3</h2>

            <div id="lampu3" class="status off">
                OFF
            </div>

        </div>


        <div class="card">

            <h2>Lampu 4</h2>

            <div id="lampu4" class="status off">
                OFF
            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- KONTROL LAMPU 3 -->
    <!-- ========================= -->

    <div class="card">

        <h2>Kontrol Lampu 3</h2>

        <div class="mode">

            <button
                id="auto3"
                onclick="setMode('lampu3', 'auto')">
                AUTO
            </button>

            <button
                id="manual3"
                onclick="setMode('lampu3', 'manual')">
                MANUAL
            </button>

        </div>

        <div class="lamp-control">

            <button
                class="btn-on"
                id="on3"
                onclick="setLamp('lampu3', 'on')">
                HIDUPKAN
            </button>

            <button
                class="btn-off"
                id="off3"
                onclick="setLamp('lampu3', 'off')">
                MATIKAN
            </button>

        </div>

        <div id="mode3" class="mode-status">
            Mode: AUTO
        </div>

    </div>


    <!-- ========================= -->
    <!-- KONTROL LAMPU 4 -->
    <!-- ========================= -->

    <div class="card">

        <h2>Kontrol Lampu 4</h2>

        <div class="mode">

            <button
                id="auto4"
                onclick="setMode('lampu4', 'auto')">
                AUTO
            </button>

            <button
                id="manual4"
                onclick="setMode('lampu4', 'manual')">
                MANUAL
            </button>

        </div>

        <div class="lamp-control">

            <button
                class="btn-on"
                id="on4"
                onclick="setLamp('lampu4', 'on')">
                HIDUPKAN
            </button>

            <button
                class="btn-off"
                id="off4"
                onclick="setLamp('lampu4', 'off')">
                MATIKAN
            </button>

        </div>

        <div id="mode4" class="mode-status">
            Mode: AUTO
        </div>

    </div>


    <!-- ========================= -->
    <!-- PESAN -->
    <!-- ========================= -->

    <div id="message" class="mode-status">
        Siap
    </div>


    <div class="update">

        Update terakhir:
        <span id="lastUpdate">-</span>

    </div>

</div>


<script>

/* =========================================
   UPDATE STATUS
========================================= */

function updateStatus() {

    fetch("/status")

        .then(response => {

            if (!response.ok) {
                throw new Error("Server error");
            }

            return response.json();

        })

        .then(data => {

            console.log("Data:", data);


            /* =================================
               GERAKAN
            ================================= */

            const gerakan =
                document.getElementById("gerakan");


            /*
             * Mendukung:
             *
             * true
             * "true"
             * 1
             */

            const motion =
                data.gerakan === true ||
                data.gerakan === "true" ||
                data.gerakan === 1;


            if (motion) {

                gerakan.textContent =
                    "Gerakan Terdeteksi";

                gerakan.className =
                    "status motion";

            } else {

                gerakan.textContent =
                    "Tidak Ada Gerakan";

                gerakan.className =
                    "status no-motion";
            }


            /* =================================
               LAMPU 3
            ================================= */

            updateLampStatus(
                "lampu3",
                data.lampu3
            );


            /* =================================
               LAMPU 4
            ================================= */

            updateLampStatus(
                "lampu4",
                data.lampu4
            );


            /* =================================
               MODE LAMPU 3
            ================================= */

            if (data.mode3) {

                updateModeUI(
                    "lampu3",
                    data.mode3
                );

            }


            /* =================================
               MODE LAMPU 4
            ================================= */

            if (data.mode4) {

                updateModeUI(
                    "lampu4",
                    data.mode4
                );

            }


            /* =================================
               WAKTU
            ================================= */

            const now = new Date();

            document.getElementById(
                "lastUpdate"
            ).textContent =
                now.toLocaleTimeString("id-ID");

        })

        .catch(error => {

            console.error(
                "Gagal mengambil status:",
                error
            );

        });
}


/* =========================================
   UPDATE STATUS LAMPU
========================================= */

function updateLampStatus(lampu, status) {

    const element =
        document.getElementById(lampu);


    if (status === "on") {

        element.textContent = "ON";

        element.className =
            "status on";

    } else {

        element.textContent = "OFF";

        element.className =
            "status off";
    }
}


/* =========================================
   SET MODE
========================================= */

function setMode(lampu, mode) {

    fetch("/control", {

        method: "POST",

        headers: {
            "Content-Type":
                "application/json"
        },

        body: JSON.stringify({

            lampu: lampu,

            mode: mode

        })

    })

    .then(response => {

        if (!response.ok) {
            throw new Error("Gagal mengubah mode");
        }

        return response.json();

    })

    .then(data => {

        console.log("Control:", data);

        updateModeUI(lampu, mode);

        showMessage(
            "Mode " +
            lampu +
            " diubah ke " +
            mode.toUpperCase(),
            false
        );

        updateStatus();

    })

    .catch(error => {

        console.error(error);

        showMessage(
            "Gagal mengubah mode",
            true
        );

    });
}


/* =========================================
   SET LAMPU ON / OFF
========================================= */

function setLamp(lampu, status) {

    /*
     * Tombol ON/OFF hanya digunakan
     * ketika mode MANUAL.
     */

    fetch("/control", {

        method: "POST",

        headers: {
            "Content-Type":
                "application/json"
        },

        body: JSON.stringify({

            lampu: lampu,

            mode: "manual",

            status: status

        })

    })

    .then(response => {

        if (!response.ok) {
            throw new Error("Gagal mengontrol lampu");
        }

        return response.json();

    })

    .then(data => {

        console.log("Control:", data);

        updateModeUI(
            lampu,
            "manual"
        );

        updateLampStatus(
            lampu,
            status
        );

        showMessage(
            lampu +
            " " +
            status.toUpperCase(),
            false
        );

        updateStatus();

    })

    .catch(error => {

        console.error(error);

        showMessage(
            "Gagal mengontrol lampu",
            true
        );

    });
}


/* =========================================
   UPDATE TAMPILAN MODE
========================================= */

function updateModeUI(lampu, mode) {

    let nomor;

    if (lampu === "lampu3") {

        nomor = "3";

    } else {

        nomor = "4";

    }


    const autoButton =
        document.getElementById(
            "auto" + nomor
        );

    const manualButton =
        document.getElementById(
            "manual" + nomor
        );

    const modeText =
        document.getElementById(
            "mode" + nomor
        );


    if (mode === "manual") {

        autoButton.classList.remove(
            "active"
        );

        manualButton.classList.add(
            "active"
        );

        modeText.textContent =
            "Mode: MANUAL";

        /*
         * Tombol ON/OFF aktif
         */

        document.getElementById(
            "on" + nomor
        ).disabled = false;

        document.getElementById(
            "off" + nomor
        ).disabled = false;

    } else {

        manualButton.classList.remove(
            "active"
        );

        autoButton.classList.add(
            "active"
        );

        modeText.textContent =
            "Mode: AUTO";

        /*
         * Pada AUTO tombol ON/OFF
         * dinonaktifkan.
         */

        document.getElementById(
            "on" + nomor
        ).disabled = true;

        document.getElementById(
            "off" + nomor
        ).disabled = true;
    }
}


/* =========================================
   PESAN
========================================= */

function showMessage(text, error) {

    const message =
        document.getElementById(
            "message"
        );

    message.textContent = text;

    if (error) {

        message.className =
            "mode-status error";

    } else {

        message.className =
            "mode-status success";
    }


    setTimeout(() => {

        message.textContent = "Siap";

        message.className =
            "mode-status";

    }, 3000);
}


/* =========================================
   UPDATE PERTAMA
========================================= */

updateStatus();


/* =========================================
   UPDATE SETIAP 1 DETIK
========================================= */

setInterval(
    updateStatus,
    1000
);

</script>

</body>
</html>
